interface:
  # 中文：子 Agent 开发
  display_name: "Subagents Develop"
  # 中文：在隔离的分支和 worktree 中安全地编排开发任务
  short_description: "Orchestrate development in isolated branches and worktrees"
  # 中文：使用 $subagents-develop 在隔离的分支和 worktree 中完成开发，并仅在我明确下令后合入主分支。
  default_prompt: "Use $subagents-develop to complete development in isolated branches and worktrees, merging into the main branch only when I explicitly ask."

policy:
  allow_implicit_invocation: true
