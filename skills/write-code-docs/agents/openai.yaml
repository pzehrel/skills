interface:
  # 中文：编写代码文档
  display_name: "Write Code Documentation"
  # 中文：在实现、重构、修复 bug 和代码审查中为文件头部、结构化字段、函数签名以及公共、私有和复杂代码编写双语注释和文档
  short_description: "Write bilingual file headers, signature docs, and field comments"
  # 中文：在编写、重构或审查代码时使用 $write-code-docs，为新建或实质性修改的代码文件添加简洁的双语头部，详细记录函数签名中的参数、返回值和失败行为，记录接口、记录和 schema 中每个消费者可见字段，并为公共、私有和复杂逻辑添加双语注释；同时维护 Agent 或 Markdown 文档，并从仓库证据确定本地化语言。
  default_prompt: "Use $write-code-docs while implementing, refactoring, or reviewing code: add a concise bilingual header to each new or materially changed code-bearing file, document every callable's parameters, return value, and failure behavior, document every consumer-visible field in interfaces, records, and schemas, add bilingual comments for public, private, and complex logic, and maintain agent or Markdown docs; infer the localized language from repository evidence."

policy:
  allow_implicit_invocation: true
