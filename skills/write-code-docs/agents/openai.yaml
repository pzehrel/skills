interface:
  # 中文：编写代码文档
  display_name: "Write Code Documentation"
  # 中文：在实现、重构、修复 bug 和代码审查中为接口、记录、schema 字段以及公共、私有和复杂代码编写双语注释和文档
  short_description: "Write bilingual comments for fields and code during implementation and review"
  # 中文：在编写、重构或审查代码时使用 $write-code-docs 主动补充接口、记录、schema 的字段级文档，以及公共、私有和复杂逻辑的英语加本地化语言双语注释，并维护 Agent 或 Markdown 文档；从仓库证据确定本地化语言。
  default_prompt: "Use $write-code-docs proactively while implementing, refactoring, or reviewing code to document each consumer-visible field in interfaces, records, and schemas, add bilingual comments for public, private, and complex logic, and maintain agent or Markdown docs; infer the localized language from repository evidence."

policy:
  allow_implicit_invocation: true
